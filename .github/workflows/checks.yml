# Checks that the samples and the Recipes they use still fit together: every template compiles
# against the Radius types, the app builds and its unit tests pass, and the setup assets render.
name: Checks

on:
  pull_request:
    paths:
      - recipes/**
      - recipe-packs/**
      - samples/OrderManagementApp/**
      - .github/workflows/checks.yml
  push:
    branches: [main]
    paths:
      - recipes/**
      - recipe-packs/**
      - samples/OrderManagementApp/**
      - .github/workflows/checks.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RADIUS_VERSION: 0.60.0
  BICEP_VERSION: v0.42.1
  SAMPLE: samples/OrderManagementApp

jobs:
  bicep:
    name: Bicep templates and Recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the Radius and Bicep CLIs
        # Pinned releases, each checked against the SHA-256 of the binary this workflow was
        # written for, rather than an install script from a moving branch.
        env:
          RADIUS_SHA256: 8683feb46a2fd8c38e702ca8a0134813d48976410b9d74e690589ae6362ddfec
          BICEP_SHA256: aed90eb2c69a6ee2bd70dc0d4354408ac4d04fd9911d3ec8e0cd74ad173e7139
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/rad" "https://github.com/radius-project/radius/releases/download/v$RADIUS_VERSION/rad_linux_amd64"
          curl -fsSLo "$HOME/.local/bin/bicep" "https://github.com/Azure/bicep/releases/download/$BICEP_VERSION/bicep-linux-x64"
          printf '%s  %s\n' "$RADIUS_SHA256" "$HOME/.local/bin/rad" "$BICEP_SHA256" "$HOME/.local/bin/bicep" | sha256sum --check --strict
          chmod +x "$HOME/.local/bin/rad" "$HOME/.local/bin/bicep"
          # rad runs Bicep from its own folder, where its install script would have put it.
          mkdir -p "$HOME/.rad/bin"
          ln -s "$HOME/.local/bin/bicep" "$HOME/.rad/bin/bicep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The app and Recipes use the Portability.Messaging/messageQueues type through this extension.
      - name: Generate the queue type's Bicep extension
        run: rad bicep publish-extension -f recipes/message-queue/messageQueues.yaml --target recipes/message-queue/messageQueues.tgz

      - name: Build every template
        run: |
          status=0
          while IFS= read -r file; do
            echo "::group::$file"
            bicep build "$file" --stdout > /dev/null || { echo "::error file=$file::bicep build failed"; status=1; }
            echo "::endgroup::"
          done < <(git ls-files '*.bicep')
          exit $status

  app:
    name: App build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SAMPLE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 9.0.320

      - name: Build
        run: dotnet build OrderManagement.sln --configuration Release -warnaserror

      # Unit tests and the API and inventory authorization tests: no containers, so they are fast and
      # don't depend on the runner. The integration tests and the end-to-end run of the app are in
      # integration.yml.
      - name: Unit tests
        run: dotnet test OrderManagement.sln --configuration Release --no-build --filter "FullyQualifiedName!~OrderManagement.Tests.Integration"


  assets:
    name: Setup assets and scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SAMPLE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Keycloak manifests and realm
        run: |
          kubectl kustomize infra/azurelocal/keycloak > /dev/null
          jq empty infra/azurelocal/keycloak/realm.json local/keycloak-users.json

      - name: Operators and object store
        run: |
          kubectl kustomize infra/azurelocal/operators/rabbitmq/cluster-operator > /dev/null
          kubectl kustomize infra/azurelocal/operators/rabbitmq/messaging-topology-operator > /dev/null
          helm template cnpg cloudnative-pg --repo https://cloudnative-pg.github.io/charts \
            --version 0.29.1 --values infra/azurelocal/operators/cloudnative-pg/operator/values.yaml > /dev/null
          helm template barman-cloud plugin-barman-cloud --repo https://cloudnative-pg.github.io/charts \
            --version 0.8.1 --values infra/azurelocal/operators/cloudnative-pg/plugin-barman-cloud/values.yaml > /dev/null
          helm template cert-manager-csi-driver cert-manager-csi-driver --repo https://charts.jetstack.io \
            --version v0.16.1 --values infra/azurelocal/operators/rabbitmq/cert-manager-csi-driver/values.yaml > /dev/null
          helm template seaweedfs seaweedfs --repo https://seaweedfs.github.io/seaweedfs/helm \
            --version 4.51.0 --values infra/azurelocal/object-store/values.yaml > /dev/null

      - name: Ingress values
        run: |
          helm template ingress-nginx ingress-nginx --repo https://kubernetes.github.io/ingress-nginx \
            --version 4.15.1 --values infra/azurelocal/ingress-nginx/values.yaml > /dev/null

      - name: Image list
        run: |
          # Every line is <source> <target> [artifact].
          awk '!/^[[:space:]]*(#|$)/ && (NF < 2 || NF > 3) { print "bad line " NR ": " $0; bad=1 } END { exit bad }' infra/azurelocal/images.txt

      - name: PowerShell scripts
        shell: pwsh
        run: |
          $errors = Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            $parseErrors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
          }
          if ($errors) { $errors; exit 1 }

          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings scripts/PSScriptAnalyzerSettings.psd1
          $findings | Format-Table ScriptName, Line, RuleName, Message -AutoSize -Wrap
          if ($findings) { exit 1 }
