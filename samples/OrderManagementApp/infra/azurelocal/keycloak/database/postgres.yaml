# Keycloak's database when Availability is 'standard': one PostgreSQL server in a StatefulSet, in the
# identity namespace, with no operator and no backups. Sign-in stops while its pod restarts, and a
# lost volume loses Keycloak's data (the realm can be imported again; users come from Active
# Directory). With 'high', cloudnative-pg.yaml here is used instead.
#
# The Service has the name CloudNativePG gives its read-write Service, keycloak-db-rw, so Keycloak
# connects to either database the same way. Connections are encrypted with a certificate from the
# site CA, which the server reloads every hour.
#
# Expects in the identity namespace:
#   Secret keycloak-db           username, password   the database login
#   Secret keycloak-db-tls       tls.crt, tls.key     the server's certificate, for keycloak-db-rw.identity.svc
#   Secret azurelocal-registry   image pull secret, when pulling from a private registry
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-db-config
data:
  # Only encrypted password connections from the network; the reload sidecar uses the local socket.
  pg_hba.conf: |
    local all all scram-sha-256
    hostssl all all all scram-sha-256
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-db-rw
spec:
  selector:
    app: keycloak-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-db
spec:
  serviceName: keycloak-db-rw
  replicas: 1
  selector:
    matchLabels:
      app: keycloak-db
  template:
    metadata:
      labels:
        app: keycloak-db
    spec:
      imagePullSecrets:
        - name: azurelocal-registry
      terminationGracePeriodSeconds: 60
      # The image runs PostgreSQL as uid 70; the group lets it read the key, which PostgreSQL accepts
      # when root owns the file with mode 0640.
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: docker.io/library/postgres:17-alpine
          args:
            - -c
            - hba_file=/etc/postgres-config/pg_hba.conf
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgres-tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgres-tls/tls.key
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: keycloak-db, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-db, key: password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h /var/run/postgresql -U \"$POSTGRES_USER\" -d keycloak"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: config
              mountPath: /etc/postgres-config
              readOnly: true
            - name: tls
              mountPath: /etc/postgres-tls
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
        # PostgreSQL reads its certificate only at start or on reload, so this asks it to reload every
        # hour; a renewed certificate is in use well before the old one expires.
        - name: reload-certificate
          image: docker.io/library/postgres:17-alpine
          command:
            - sh
            - -c
            - while true; do sleep 3600; PGPASSWORD="$POSTGRES_PASSWORD" psql -h /var/run/postgresql -U "$POSTGRES_USER" -d keycloak -qc "SELECT pg_reload_conf()" || true; done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: keycloak-db, key: username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-db, key: password }
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: config
          configMap:
            name: keycloak-db-config
        - name: tls
          secret:
            secretName: keycloak-db-tls
            defaultMode: 0640
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
