# Keycloak on the Azure Local cluster: the on-site identity provider for user sign-in and for
# workload tokens. Apply with `kubectl apply -k infra/azurelocal/keycloak`; see README.md here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: identity

resources:
  - service.yaml
  - keycloak.yaml
  - realm-config.yaml

# Keycloak's database is applied next to this, from database/: cloudnative-pg.yaml when Availability
# is 'high', postgres.yaml when it's 'standard'.

# realm-config.yaml applies realm.json to Keycloak on every deployment. Its ${...} placeholders are
# filled from the keycloak-realm-settings ConfigMap and the Secrets you create per site. A changed
# realm.json gets a new ConfigMap name, so the Job has to be deleted before applying (see the Job).
configMapGenerator:
  - name: keycloak-realm
    files:
      - realm.json

# Exact versions. keycloak-config-cli's tag names the Keycloak version it was built against; it
# works with the same major version. On a site that pulls from its own registry, such as an ACR
# connected registry, keycloak.ps1 points these, and the database's image, at it with an overlay;
# by hand, add `newName: <registry>/<path>` entries the same way.
images:
  - name: quay.io/keycloak/keycloak
    newTag: "26.8.1"
  - name: docker.io/adorsys/keycloak-config-cli
    newTag: "6.5.1-26.5.5"
