# Keycloak in the identity namespace: two replicas on separate nodes, sharing the database in
# database/ and clustering through it, so sign-in survives losing a node. Users reach it on the load
# balancer address in service.yaml. The realm comes from realm-config.yaml, not from Keycloak itself.
#
# Expects these to exist in the identity namespace (see README.md in this folder):
#   Secret keycloak-admin-client    client-id, client-secret   temporary admin service account, for realm-config.yaml
#   Secret keycloak-db              username, password    database login (type kubernetes.io/basic-auth)
#   Secret keycloak-tls             tls.crt, tls.key, ca.crt   Keycloak's serving certificate, from cert-manager
#   Secret keycloak-db-tls          ca.crt                the CA behind the database's certificate, from cert-manager
#   Secret cluster-ca               cluster-ca.pem        the cluster's CA, to verify service account tokens
#   Secret oms-ad-ca                ca.crt                directory CA, for LDAPS (optional)
#   ConfigMap keycloak-realm-settings                     site values from realm-settings.env
#   Secret azurelocal-registry      image pull secret, when pulling from a private registry
---
# Keycloak verifies service account tokens against the cluster's signing keys, which the API
# server only serves to authenticated callers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keycloak-issuer-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - kind: ServiceAccount
    name: default
    namespace: identity
---
# Keeps one Keycloak serving while a node is drained.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
  namespace: identity
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
spec:
  replicas: 2
  # One pod at a time, and the new one ready before an old one stops, so the cluster always has a
  # member to join and sign-in never pauses.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      imagePullSecrets:
        - name: azurelocal-registry
      # Lets a stopping pod leave the cluster cleanly and hand its sessions over.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: keycloak
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak
          args: ["start", "--optimized=false"]
          # Keycloak builds itself for the options below when it starts, into /opt/keycloak/lib, so
          # its root filesystem stays writable.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # Keycloak's own address, which tokens name as their issuer. Keycloak reads it only when
            # it starts.
            - name: KC_HOSTNAME
              valueFrom:
                configMapKeyRef: { name: keycloak-realm-settings, key: KC_HOSTNAME }
            # The admin console is served for this address only, which is not on the site network:
            # administrators reach it with `kubectl port-forward` (see README.md).
            - name: KC_HOSTNAME_ADMIN
              value: https://localhost:8443
            # A temporary admin service account, created in the master realm on Keycloak's first
            # start. realm-config.yaml signs in with it; there is no admin user.
            - name: KC_BOOTSTRAP_ADMIN_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: keycloak-admin-client, key: client-id }
            - name: KC_BOOTSTRAP_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: keycloak-admin-client, key: client-secret }
            - name: KC_DB
              value: postgres
            # The read-write Service: CloudNativePG's follows the primary through a failover, and
            # database/postgres.yaml's has the same name. The server's certificate is checked
            # against the CA that issued it, and its name against the address.
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-db-rw:5432/keycloak?sslmode=verify-full&sslrootcert=/opt/keycloak/conf/db-ca/ca.crt
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef: { name: keycloak-db, key: username }
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-db, key: password }
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /opt/keycloak/conf/tls/tls.crt
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /opt/keycloak/conf/tls/tls.key
            # cert-manager renews the certificate in the mounted Secret; Keycloak picks it up on
            # its next read, with no restart.
            - name: KC_HTTPS_CERTIFICATES_RELOAD_PERIOD
              value: 10m
            - name: KC_HEALTH_ENABLED
              value: "true"
            # The replicas find each other through the database (the default jdbc-ping stack) and
            # share sessions, so either one can serve any user.
            - name: KC_CACHE
              value: ispn
            # Exchanging a Kubernetes service account token needs this feature, at v1.
            - name: KC_FEATURES
              value: kubernetes-service-accounts:v1
            # Trusts the cluster CA (for the API server's signing keys) and the directory CA (for LDAPS).
            - name: KC_TRUSTSTORE_PATHS
              value: /opt/keycloak/conf/truststores
          ports:
            - name: https
              containerPort: 8443
            - name: jgroups
              containerPort: 7800
            - name: jgroups-fd
              containerPort: 57800
          # Health is on the management port. The first start builds Keycloak and creates the
          # database schema, which can take minutes; after that, a pod that stops answering is
          # restarted.
          startupProbe:
            httpGet:
              path: /health/started
              port: 9000
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: truststore
              mountPath: /opt/keycloak/conf/truststores
              readOnly: true
            - name: tls
              mountPath: /opt/keycloak/conf/tls
              readOnly: true
            - name: db-ca
              mountPath: /opt/keycloak/conf/db-ca
              readOnly: true
      volumes:
        - name: truststore
          projected:
            sources:
              - secret:
                  name: cluster-ca
              - secret:
                  name: oms-ad-ca
                  optional: true
        - name: tls
          secret:
            secretName: keycloak-tls
        # Only the CA from the database's certificate Secret, not its key.
        - name: db-ca
          secret:
            secretName: keycloak-db-tls
            items:
              - key: ca.crt
                path: ca.crt
