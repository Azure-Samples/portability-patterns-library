# Keycloak in the identity namespace: two replicas on separate nodes, sharing the database in
# database/ and clustering through it, so sign-in survives losing a node. Users reach it on the load
# balancer address in service.yaml.
#
# Expects these to exist in the identity namespace (see README.md in this folder):
#   Secret keycloak-admin           username, password    bootstrap admin
#   Secret keycloak-db              username, password    database login (type kubernetes.io/basic-auth)
#   Secret keycloak-tls             tls.crt, tls.key      Keycloak's serving certificate, from cert-manager
#   Secret cluster-ca               cluster-ca.pem        the cluster's CA, to verify service account tokens
#   Secret oms-ad-bind              bind-upn, bind-password   read-only directory account
#   Secret oms-ad-ca                ca.crt                directory CA, for LDAPS (optional)
#   Secret grafana-oauth            client-id, client-secret  the grafana client's secret
#   ConfigMap keycloak-realm-settings                     site values from realm-settings.env
#   Secret azurelocal-registry      image pull secret, when pulling from a private registry
---
# Keycloak verifies service account tokens against the cluster's signing keys, which the API
# server only serves to authenticated callers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keycloak-issuer-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - kind: ServiceAccount
    name: default
    namespace: identity
---
# Keeps one Keycloak serving while a node is drained.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keycloak
  namespace: identity
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
spec:
  replicas: 2
  # One pod at a time, and the new one ready before an old one stops, so the cluster always has a
  # member to join and sign-in never pauses.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      imagePullSecrets:
        - name: azurelocal-registry
      # Lets a stopping pod leave the cluster cleanly and hand its sessions over.
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: keycloak
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak
          args: ["start", "--import-realm", "--optimized=false"]
          # Site values: KC_HOSTNAME, and the ${...} placeholders in realm.json.
          envFrom:
            - configMapRef:
                name: keycloak-realm-settings
          env:
            # The grafana client's secret, for its placeholder in realm.json.
            - name: GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: grafana-oauth, key: client-secret }
            - name: LDAP_BIND_DN
              valueFrom:
                secretKeyRef: { name: oms-ad-bind, key: bind-upn }
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef: { name: oms-ad-bind, key: bind-password }
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: { name: keycloak-admin, key: username }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-admin, key: password }
            - name: KC_DB
              value: postgres
            # The read-write Service: CloudNativePG's follows the primary through a failover, and
            # database/statefulset.yaml's has the same name.
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-db-rw:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef: { name: keycloak-db, key: username }
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: keycloak-db, key: password }
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /opt/keycloak/conf/tls/tls.crt
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /opt/keycloak/conf/tls/tls.key
            # cert-manager renews the certificate in the mounted Secret; Keycloak picks it up on
            # its next read, with no restart.
            - name: KC_HTTPS_CERTIFICATES_RELOAD_PERIOD
              value: 10m
            - name: KC_HEALTH_ENABLED
              value: "true"
            # The replicas find each other through the database (the default jdbc-ping stack) and
            # share sessions, so either one can serve any user.
            - name: KC_CACHE
              value: ispn
            # Exchanging a Kubernetes service account token needs this feature, at v1.
            - name: KC_FEATURES
              value: kubernetes-service-accounts:v1
            # Trusts the cluster CA (for the API server's signing keys) and the directory CA (for LDAPS).
            - name: KC_TRUSTSTORE_PATHS
              value: /opt/keycloak/conf/truststores
          ports:
            - name: https
              containerPort: 8443
            - name: jgroups
              containerPort: 7800
            - name: jgroups-fd
              containerPort: 57800
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: truststore
              mountPath: /opt/keycloak/conf/truststores
              readOnly: true
            - name: tls
              mountPath: /opt/keycloak/conf/tls
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
        - name: truststore
          projected:
            sources:
              - secret:
                  name: cluster-ca
              - secret:
                  name: oms-ad-ca
                  optional: true
        - name: tls
          secret:
            secretName: keycloak-tls