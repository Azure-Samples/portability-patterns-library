# Points each node's containerd at the registry settings the connected registry's Arc extension
# writes, so kubelet trusts the in-cluster registry's certificate. Applied by
# scripts/infra/azurelocal/connected-registry.ps1 when the nodes run containerd 2.
#
# The extension puts the registry's CA and a hosts.toml in /etc/containerd/certs.d/<address>/ on
# every node, and adds the setting that makes containerd read that directory in containerd 1.x's
# format only. containerd 2, which AKS on Azure Local nodes run, reads it from
# [plugins.'io.containerd.cri.v1.images'.registry] config_path, which the node image leaves empty.
# Without this, every pull from the registry fails with "x509: certificate signed by unknown
# authority".
#
# The pod sets that one value when it's empty, keeping the original file as config.toml.oms-orig,
# and restarts containerd; running containers keep running. It checks again every minute, so a node
# added later or a configuration file rewritten by an update is fixed too. It's ready once the
# setting is in place, and changes nothing else on the node.
apiVersion: v1
kind: Namespace
metadata:
  name: oms-node-config
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: containerd-registry-hosts
  namespace: oms-node-config
spec:
  selector:
    matchLabels:
      app: containerd-registry-hosts
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: containerd-registry-hosts
    spec:
      hostPID: true
      priorityClassName: system-node-critical
      automountServiceAccountToken: false
      containers:
        - name: configure
          # Pulled from Microsoft's registry: the connected registry is what this makes reachable.
          image: mcr.microsoft.com/azurelinux/base/core:3.0
          securityContext:
            privileged: true
          command: ["chroot", "/host", "sh", "-c"]
          args:
            - |
              conf=/etc/containerd/config.toml
              want=/etc/containerd/certs.d
              marker=/run/oms-containerd-registry-hosts
              section="^[[:space:]]*\[plugins\.'io\.containerd\.cri\.v1\.images'\.registry\]"
              rm -f "$marker"
              while :; do
                if ! grep -q "$section" "$conf"; then
                  echo "no [plugins.'io.containerd.cri.v1.images'.registry] in $conf; this node doesn't run containerd 2's configuration"
                  rm -f "$marker"
                else
                  current=$(sed -n "/$section/,/^[[:space:]]*\[/p" "$conf" | sed -n "s/^[[:space:]]*config_path[[:space:]]*=[[:space:]]*//p" | head -n 1)
                  if [ "$current" = "''" ] || [ "$current" = '""' ]; then
                    [ -f "$conf.oms-orig" ] || cp -p "$conf" "$conf.oms-orig"
                    sed -i "/$section/,/^[[:space:]]*\[/ s#^\([[:space:]]*config_path[[:space:]]*=[[:space:]]*\).*#\1'$want'#" "$conf"
                    echo "$(date -u +%FT%TZ) set config_path to $want; restarting containerd"
                    rm -f "$marker"
                    systemctl restart containerd
                  elif [ "$current" = "'$want'" ] && systemctl is-active --quiet containerd; then
                    [ -f "$marker" ] || echo "$(date -u +%FT%TZ) config_path is $want"
                    touch "$marker"
                  else
                    echo "config_path is $current, not empty; left as is"
                    rm -f "$marker"
                  fi
                fi
                sleep 60
              done
          readinessProbe:
            exec:
              command: ["test", "-f", "/host/run/oms-containerd-registry-hosts"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: host
              mountPath: /host
      volumes:
        - name: host
          hostPath:
            path: /
