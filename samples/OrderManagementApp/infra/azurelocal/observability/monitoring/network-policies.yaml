# Network policies for namespace observability. Nothing in it has authentication of its own
# (Loki, Tempo, Prometheus, Alertmanager), so only what needs each one may reach it:
#   - the OpenTelemetry Collector: OTLP from any namespace, since that's where the app sends;
#   - Loki and Tempo: the collector writes, Grafana reads;
#   - Prometheus and Alertmanager: Grafana, and the ingress controller (namespace ingress-nginx);
#   - Grafana: the ingress controller, which serves it at /grafana;
#   - every pod: Prometheus, for its metrics, and Prometheus also sends Alertmanager its alerts.
# Kubelet health probes aren't affected. node-exporter runs on the host network, which these don't
# cover. Applied with the rest of this folder by provision-observability.ps1.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-from-prometheus
  namespace: observability
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: collector-from-cluster
  namespace: observability
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: opentelemetry-collector }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - { port: 4317, protocol: TCP }  # OTLP gRPC
        - { port: 4318, protocol: TCP }  # OTLP HTTP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-from-collector-and-grafana
  namespace: observability
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: loki }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: opentelemetry-collector }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: grafana }
      ports:
        - { port: 3100, protocol: TCP }
    # Its own ring (memberlist) and gRPC between its components, all in the one pod today.
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: loki }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-from-collector-and-grafana
  namespace: observability
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: tempo }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: opentelemetry-collector }
      ports:
        - { port: 4317, protocol: TCP }
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: grafana }
      ports:
        - { port: 3200, protocol: TCP }
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: tempo }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-from-grafana-and-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: grafana }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - { port: 9090, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-from-grafana-and-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: alertmanager }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: grafana }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - { port: 9093, protocol: TCP }
    # Replicas gossip silences and notifications to each other.
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: alertmanager }
      ports:
        - { port: 9094, protocol: TCP }
        - { port: 9094, protocol: UDP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-from-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: grafana }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - { port: 3000, protocol: TCP }
