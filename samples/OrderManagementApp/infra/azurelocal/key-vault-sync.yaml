# How the Key Vault Secret Store extension brings the sample's Key Vault secrets to the site. Applied
# by scripts/infra/azurelocal/key-vault.ps1 with the ${...} values filled in;
# infra/azurelocal/key-vault.bicep federates the vault's reader identity with the service account.
#
# The extension reads secret archive-signing-key from the vault as that service account and writes
# it to Kubernetes Secret archive-signing (key `key`). The Recipe Pack mounts that Secret into the
# order processor only, which signs every archived order with it. The extension checks the vault for
# a new version while the site is connected (hourly by default); with the link down, the last copy
# keeps working. To bring another secret, add it to `objects` and `data`, or add a pair like this.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${SERVICE_ACCOUNT}
  namespace: ${NAMESPACE}
  annotations:
    azure.workload.identity/client-id: "${CLIENT_ID}"
    azure.workload.identity/tenant-id: "${TENANT_ID}"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: archive-signing
  namespace: ${NAMESPACE}
spec:
  provider: azure
  parameters:
    clientID: "${CLIENT_ID}"
    keyvaultName: ${KEYVAULT_NAME}
    tenantID: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: archive-signing-key
          objectType: secret
---
apiVersion: secret-sync.x-k8s.io/v1alpha1
kind: SecretSync
metadata:
  name: archive-signing
  namespace: ${NAMESPACE}
spec:
  serviceAccountName: ${SERVICE_ACCOUNT}
  secretProviderClassName: archive-signing
  secretObject:
    type: Opaque
    data:
      - sourcePath: archive-signing-key
        targetKey: key
