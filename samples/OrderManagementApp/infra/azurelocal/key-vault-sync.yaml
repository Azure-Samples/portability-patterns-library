# The service account the Key Vault Secret Store extension reads the vault as, in the namespace the
# secrets go to. Applied by scripts/infra/azurelocal/key-vault.ps1 with the ${...} values filled in;
# infra/azurelocal/key-vault.bicep federates the vault's reader identity with it.
#
# Nothing in the sample is synced by default: its database passwords and object store keys are
# generated on site. To bring a secret that already lives in Key Vault to the site, add it to the
# vault and apply a SecretProviderClass and a SecretSync next to this account, for example:
#
#   apiVersion: secrets-store.csi.x-k8s.io/v1
#   kind: SecretProviderClass
#   metadata:
#     name: partner-api
#     namespace: <namespace>
#   spec:
#     provider: azure
#     parameters:
#       clientID: "<syncClientId output of key-vault.bicep>"
#       keyvaultName: <vault>
#       tenantID: "<tenant>"
#       objects: |
#         array:
#           - |
#             objectName: partner-api-key
#             objectType: secret
#   ---
#   apiVersion: secret-sync.x-k8s.io/v1alpha1
#   kind: SecretSync
#   metadata:
#     name: partner-api
#     namespace: <namespace>
#   spec:
#     serviceAccountName: secret-sync
#     secretProviderClassName: partner-api
#     secretObject:
#       type: Opaque
#       data:
#         - sourcePath: partner-api-key
#           targetKey: api-key
#
# The extension checks the vault for new versions while the site is connected (hourly by default);
# with the link down, the last copy keeps working.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${SERVICE_ACCOUNT}
  namespace: ${NAMESPACE}
  annotations:
    azure.workload.identity/client-id: "${CLIENT_ID}"
    azure.workload.identity/tenant-id: "${TENANT_ID}"