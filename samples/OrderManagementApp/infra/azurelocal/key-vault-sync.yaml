# Syncs the database passwords from Azure Key Vault into the Secret oms-db-passwords in the
# application namespace, through the Key Vault Secret Store extension. Applied by
# scripts/infra/azurelocal/key-vault.ps1 with the ${...} values filled in.
#
# No service reads oms-db-passwords; only the database setup job does. It is where new versions
# arrive: scripts/deploy.ps1 sets them in the databases (the setup job reads them from here), then
# copies each service's own password into {service}-db-credentials, which the Recipe Pack hands to
# the service. A pod that restarts in between keeps the password the database still has. With the
# link to Azure down, the last copies keep working.
#
# The administrator passwords are synced here too, into the application namespace, because that's
# where everything that uses them runs, and a pod can only read Secrets in its own namespace: the
# SQL Server and PostgreSQL servers the Recipes deploy there (each Recipe keeps its administrator
# password in a Secret next to its server), and the database setup job (scripts/lib/database.ps1),
# which signs in as administrator to create each service's user. Syncing them elsewhere would add a
# copy, not remove this one. Moving them out takes the database servers and the setup job out of
# the application namespace. Until then, keep Secret read access in the namespace to the deploy
# identity and cluster administrators: the services' own accounts have none.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${SERVICE_ACCOUNT}
  namespace: ${NAMESPACE}
  annotations:
    azure.workload.identity/client-id: "${CLIENT_ID}"
    azure.workload.identity/tenant-id: "${TENANT_ID}"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: oms-key-vault
  namespace: ${NAMESPACE}
spec:
  provider: azure
  parameters:
    clientID: "${CLIENT_ID}"
    keyvaultName: ${KEYVAULT_NAME}
    tenantID: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: sql-admin-password
          objectType: secret
        - |
          objectName: postgres-admin-password
          objectType: secret
        - |
          objectName: sql-api-password
          objectType: secret
        - |
          objectName: sql-processor-password
          objectType: secret
        - |
          objectName: postgres-inventory-password
          objectType: secret
---
apiVersion: secret-sync.x-k8s.io/v1alpha1
kind: SecretSync
metadata:
  name: oms-db-passwords
  namespace: ${NAMESPACE}
spec:
  serviceAccountName: ${SERVICE_ACCOUNT}
  secretProviderClassName: oms-key-vault
  secretObject:
    type: Opaque
    data:
      - sourcePath: sql-admin-password
        targetKey: sql-admin-password
      - sourcePath: postgres-admin-password
        targetKey: postgres-admin-password
      - sourcePath: sql-api-password
        targetKey: sql-api-password
      - sourcePath: sql-processor-password
        targetKey: sql-processor-password
      - sourcePath: postgres-inventory-password
        targetKey: postgres-inventory-password
