apiVersion: v1
kind: Namespace
metadata:
  name: bcd-registry
---
# An in-cluster OCI registry.
#
# Radius pulls Bicep Recipes from the control plane pods, so a registry running only on the
# developer workstation (localhost:5000) is unreachable. Running it inside the cluster gives one
# address that both the cluster and, through the NodePort, the workstation can use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: bcd-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: bcd-registry
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - name: registry
      port: 5000
      targetPort: 5000
      # Mapped to localhost:5000 on the host by the kind cluster configuration.
      nodePort: 30500
