# Runs the whole app on your machine, with the same backing services as Azure Local:
# RabbitMQ for the queue, SQL Server for orders, PostgreSQL for the inventory, SeaweedFS for object
# storage (S3) and Keycloak for sign-in.
#
#   docker compose up --build
#
# Once, before the first run: Keycloak serves sign-in over HTTPS with the .NET development certificate.
#   dotnet dev-certs https --trust
#   dotnet dev-certs https --export-path local/certs/localhost.crt --format Pem --no-password
#
# Then open http://localhost:8080 and sign in as demo / demo (places orders) or as
# manager / manager (inventory admin: sees orders and can restock).
#
# The app gets its connections from CONNECTION_* environment variables, the same ones Radius sets
# from the Recipes' outputs on Azure and Azure Local. Nothing in the app is specific to this file.
# As there, dbsetup runs first as the database administrator; each service then signs in as its
# own least-privilege principal (SQL logins api and processor, PostgreSQL role inventory).
# Locally the services call each other without tokens.

name: order-management

x-sql: &sql
  # The database: Radius.Data/sqlServerDatabases
  CONNECTION_SQL_HOST: sql
  CONNECTION_SQL_PORT: "1433"
  CONNECTION_SQL_DATABASE: omsdb

x-inventorydb: &inventorydb
  # The inventory database: PostgreSQL. The local server has no TLS.
  CONNECTION_INVENTORYDB_HOST: postgres
  CONNECTION_INVENTORYDB_PORT: "5432"
  CONNECTION_INVENTORYDB_DATABASE: inventory
  CONNECTION_INVENTORYDB_TLS: optional

x-connections: &connections
  <<: *sql
  # The queue: Portability.Messaging/messageQueues
  CONNECTION_QUEUE_PROVIDER: rabbitmq
  CONNECTION_QUEUE_ENDPOINT: rabbitmq:5672
  # The local broker has no TLS.
  CONNECTION_QUEUE_TLS: optional
  CONNECTION_QUEUE_QUEUENAME: orders
  CONNECTION_QUEUE_USERNAME: oms
  CONNECTION_QUEUE_PASSWORD: ${LOCAL_PASSWORD:-Local-only-Passw0rd}
  # Object storage: Radius.Storage/objectStorage, an S3 bucket.
  CONNECTION_ARCHIVE_ENDPOINT: http://seaweedfs:8333
  CONNECTION_ARCHIVE_CONTAINERNAME: orders
  CONNECTION_ARCHIVE_ACCESSKEYID: oms
  CONNECTION_ARCHIVE_SECRETACCESSKEY: ${LOCAL_PASSWORD:-Local-only-Passw0rd}
  # The inventory service, called without a token here.
  Inventory__BaseUrl: http://inventory:8080

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      <<: *connections
      OTEL_SERVICE_NAME: api
      SQL_USERNAME: api
      SQL_PASSWORD: ${LOCAL_PASSWORD:-Local-only-Passw0rd}
      # Sign-in, as on Azure Local. The browser reaches Keycloak at localhost:8443 and the API
      # reaches it at keycloak:8080; the token's issuer is the browser's address in both cases.
      AzureAd__Authority: https://localhost:8443/realms/oms
      AzureAd__MetadataAddress: http://keycloak:8080/realms/oms/.well-known/openid-configuration
      AzureAd__RequireHttpsMetadata: "false"
      AzureAd__TokenValidationParameters__ValidIssuer: https://localhost:8443/realms/oms
      AzureAd__ClientId: oms-api
      AzureAd__Audience: oms-api
      Spa__Authority: https://localhost:8443/realms/oms
      Spa__ClientId: oms-spa
      Spa__ProtocolMode: OIDC
      Spa__KnownAuthorities: localhost:8443
      Spa__ApiScope: api://oms-api/access_as_user
      Spa__IdentityProvider: Keycloak
      Spa__Environment: Local
    depends_on:
      dbsetup: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      sql: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      inventory: { condition: service_started }

  processor:
    build:
      context: .
      dockerfile: docker/Dockerfile.processor
    environment:
      <<: *connections
      OTEL_SERVICE_NAME: processor
      SQL_USERNAME: processor
      SQL_PASSWORD: ${LOCAL_PASSWORD:-Local-only-Passw0rd}
    depends_on:
      dbsetup: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      sql: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
      inventory: { condition: service_started }

  inventory:
    build:
      context: .
      dockerfile: docker/Dockerfile.inventory
    environment:
      <<: *inventorydb
      OTEL_SERVICE_NAME: inventory
      POSTGRES_USERNAME: inventory
      POSTGRES_PASSWORD: ${LOCAL_PASSWORD:-Local-only-Passw0rd}
      # No InventoryAuth__Authority: service tokens are not checked locally.
    depends_on:
      dbsetup: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }

  # Creates the databases, tables, seed data and the services' logins, then exits.
  dbsetup:
    build:
      context: .
      dockerfile: docker/Dockerfile.dbsetup
    environment:
      <<: [*sql, *inventorydb]
      SQL_ADMIN_USERNAME: sa
      SQL_ADMIN_PASSWORD: ${LOCAL_PASSWORD:-Local-only-Passw0rd}
      SQL_API_PASSWORD: ${LOCAL_PASSWORD:-Local-only-Passw0rd}
      SQL_PROCESSOR_PASSWORD: ${LOCAL_PASSWORD:-Local-only-Passw0rd}
      POSTGRES_ADMIN_USERNAME: postgres
      POSTGRES_ADMIN_PASSWORD: ${LOCAL_PASSWORD:-Local-only-Passw0rd}
      INVENTORY_DB_PASSWORD: ${LOCAL_PASSWORD:-Local-only-Passw0rd}
    depends_on:
      sql: { condition: service_healthy }
      postgres: { condition: service_healthy }

  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_PASSWORD:-Local-only-Passw0rd}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      retries: 24
  rabbitmq:
    image: docker.io/library/rabbitmq:4-management-alpine
    # Runs as the image's own user, so it can create its data folder on any container engine.
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: oms
      RABBITMQ_DEFAULT_PASS: ${LOCAL_PASSWORD:-Local-only-Passw0rd}
    ports:
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 12

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${LOCAL_PASSWORD:-Local-only-Passw0rd}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 18

  # One SeaweedFS process (master, volume server, filer and S3 together): the store Azure Local runs
  # replicated. The keys below make an S3 identity that may do everything.
  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.51
    command: ["server", "-dir=/data", "-s3", "-ip.bind=0.0.0.0", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: oms
      AWS_SECRET_ACCESS_KEY: ${LOCAL_PASSWORD:-Local-only-Passw0rd}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 5s
      retries: 24

  # The same realm as on Azure Local (infra/azurelocal/keycloak/realm.json), plus a local test user.
  # Its Active Directory connection points nowhere here; local users don't need it.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    ports:
      - "8443:8443"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${LOCAL_PASSWORD:-Local-only-Passw0rd}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      # Tokens carry the browser's address as issuer; calls from other containers still work.
      KC_HOSTNAME: https://localhost:8443
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/certs/localhost.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/certs/localhost.key
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Values for the realm's placeholders.
      SPA_ORIGIN: http://localhost:8080
      LDAP_URL: ldap://localhost:389
      LDAP_USERS_DN: OU=OMS,DC=example,DC=local
      LDAP_BIND_DN: unused
      LDAP_BIND_PASSWORD: unused
      KUBERNETES_ISSUER: https://kubernetes.default.svc.cluster.local
      # No cluster locally: nothing to fetch signing keys from.
      KUBERNETES_ISSUER_DISCOVERY_URL: ""
      WORKLOAD_NAMESPACE: unused
      # Grafana is not part of the local run.
      GRAFANA_ORIGIN: http://localhost:3000
      GRAFANA_CLIENT_SECRET: unused
    volumes:
      - ./infra/azurelocal/keycloak/realm.json:/opt/keycloak/data/import/oms-realm.json:ro
      - ./local/keycloak-users.json:/opt/keycloak/data/import/oms-users-0.json:ro
      - ./local/certs:/opt/keycloak/conf/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      retries: 30
