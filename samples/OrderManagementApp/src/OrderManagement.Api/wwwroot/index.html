<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contoso Field Supply - Orders</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header>
    <strong>Contoso Field Supply</strong>
    <span id="platform" class="muted"></span>
    <span id="user-area" hidden>
      <span id="user"></span>
      <button id="sign-out" type="button">Sign out</button>
    </span>
  </header>

  <main>
    <p id="loading-view" class="muted">Loading&hellip;</p>

    <section id="signin-view" hidden>
      <h1>Sign in</h1>
      <p>Sign in with your organization account to place and track supply orders.</p>
      <button id="sign-in" type="button" class="primary">Sign in</button>
      <p id="signin-error" class="alert error" role="alert" hidden></p>
    </section>

    <div id="orders-view" hidden>
      <p id="role-banner" class="alert" role="status" hidden></p>
      <p id="stock-banner" class="alert" role="status" hidden></p>
      <p id="message" role="status" hidden></p>

      <section>
        <h2>New order</h2>
        <table>
          <thead><tr><th>Product</th><th>SKU</th><th>Price</th><th>In stock</th><th>Quantity</th></tr></thead>
          <tbody id="catalog"></tbody>
        </table>
        <p>Total <strong id="order-total">$0.00</strong>
          <button id="place-order" type="button" class="primary" disabled>Place order</button></p>
      </section>

      <section>
        <h2>Your orders <button id="refresh" type="button">Refresh</button></h2>
        <table>
          <thead><tr><th>Order</th><th>Items</th><th>Total</th><th>Status</th><th>Placed</th></tr></thead>
          <tbody id="orders"></tbody>
        </table>
        <p id="orders-empty" class="muted" hidden>No orders yet.</p>
      </section>

      <section id="inventory-panel" hidden>
        <h2>Inventory</h2>
        <table>
          <thead><tr><th>Product</th><th>SKU</th><th>Available</th><th>Reorder level</th><th>Restock</th></tr></thead>
          <tbody id="inventory"></tbody>
        </table>
      </section>
    </div>
  </main>

  <script src="lib/msal-browser/msal-browser.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
