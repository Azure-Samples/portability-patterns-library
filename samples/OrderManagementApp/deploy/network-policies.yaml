# Network policies for the Order Management app. Applied by the deploy scripts after `rad deploy`,
# with ${NAMESPACE}, ${INGRESS_NAMESPACE} and ${MONITORING_NAMESPACE} filled in.
#
# Nothing may reach a pod in the namespace unless a policy below allows it: users reach only the API,
# through the ingress controller (and cert-manager's challenge solver, to get the certificate);
# only the API and processor reach the inventory service; each
# database and broker accepts only the services that use it. Kubelet health probes are not affected.
# The backing-service policies match containers that exist only on Azure Local; on Azure they select
# nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ${NAMESPACE}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-ingress
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels: { radapp.io/resource: api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ${INGRESS_NAMESPACE} }
      ports:
        - { port: 8080, protocol: TCP }
---
# cert-manager answers Let's Encrypt's HTTP-01 challenge from a solver pod it starts in this
# namespace, reached through the ingress controller. Without this the certificate is never issued.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-solver-from-ingress
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels: { acme.cert-manager.io/http01-solver: "true" }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ${INGRESS_NAMESPACE} }
      ports:
        - { port: 8089, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory-from-callers
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels: { radapp.io/resource: inventory }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: radapp.io/resource, operator: In, values: [api, processor] }
      # HTTPS only; the plain HTTP port is for the kubelet's probes, which policies don't affect.
      ports:
        - { port: 8443, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sql-from-services
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels: { app: mssql }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: radapp.io/resource, operator: In, values: [api, processor] }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: dbsetup }
      ports:
        - { port: 1433, protocol: TCP }
---
# The PostgreSQL servers, labelled app=postgres by both Recipes: the inventory service and the setup
# job connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-inventory
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { radapp.io/resource: inventory }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: dbsetup }
      ports:
        - { port: 5432, protocol: TCP }
---
# With high availability, the PostgreSQL pods CloudNativePG runs, selected by its cnpg.io/cluster
# label, which its instances and the jobs that create replicas both carry: they replicate from each
# other; the operator checks each instance's status on 8000; the monitoring namespace scrapes their
# metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-cluster
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchExpressions:
      - { key: cnpg.io/cluster, operator: Exists }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: cnpg.io/cluster, operator: Exists }
      ports:
        - { port: 5432, protocol: TCP }
        - { port: 8000, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }
      ports:
        - { port: 8000, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ${MONITORING_NAMESPACE} }
      ports:
        - { port: 9187, protocol: TCP }
---
# The RabbitMQ brokers, labelled app=rabbitmq by both Recipes: the API and processor connect; with
# high availability the nodes talk to each other (clustering and quorum queue replication) and the
# Messaging Topology Operator manages queues through the management API; the monitoring namespace
# scrapes the broker's metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-from-services
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels: { app: rabbitmq }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: radapp.io/resource, operator: In, values: [api, processor] }
      ports:
        - { port: 5671, protocol: TCP }  # AMQP over TLS
    - from:
        - podSelector:
            matchLabels: { app: rabbitmq }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: rabbitmq-system }
      ports:
        - { port: 15671, protocol: TCP }  # management API over TLS
    # Broker metrics, for the dead-letter alert.
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ${MONITORING_NAMESPACE} }
      ports:
        - { port: 15691, protocol: TCP }  # Prometheus over TLS
