namespace: OrderManagement.Messaging
types:
  messageQueues:
    description: |
      A durable point-to-point queue, independent of the broker behind it. The application declares
      the queue; the environment's Recipe decides what backs it: Azure Service Bus on Azure, a
      RabbitMQ container on Azure Local. Radius has no built-in queue type that covers both.

      A container connected to the queue as `queue` receives `CONNECTION_QUEUE_*` environment
      variables, starting with `CONNECTION_QUEUE_PROVIDER` (`servicebus` or `rabbitmq`), which the
      application uses to pick its client. See deploy/app.bicep for a complete example.
    apiVersions:
      '2025-08-01-preview':
        schema:
          type: object
          properties:
            environment:
              type: string
              description: "(Required) The Radius Environment ID. Typically set by the rad CLI. Typically value should be `environment`."
            application:
              type: string
              description: "(Optional) The Radius Application ID. `myApplication.id` for example."
            queueName:
              type: string
              description: "(Optional) Name of the queue to create. Defaults to the name of the Radius resource."
            maxDeliveryCount:
              type: integer
              description: "(Optional) How many times a message is redelivered before it is dead-lettered. Defaults to 10."
            provider:
              type: string
              description: "(Read Only) The broker backing this queue. Either `rabbitmq` or `servicebus`. Set by the Recipe."
              readOnly: true
            host:
              type: string
              description: "(Read Only) Hostname of the broker. Set by RabbitMQ Recipes."
              readOnly: true
            port:
              type: string
              description: "(Read Only) Port of the broker. Set by RabbitMQ Recipes."
              readOnly: true
            namespaceFqdn:
              type: string
              description: "(Read Only) Fully qualified domain name of the Azure Service Bus namespace. Set by Azure Recipes."
              readOnly: true
            workloadIdentityClientId:
              type: string
              description: "(Read Only) Client ID of the user-assigned managed identity federated with the cluster. Set by Azure Recipes."
              readOnly: true
            oauthTokenEndpoint:
              type: string
              description: "(Read Only) Token endpoint of the identity provider the broker trusts. Set by Recipes that enable OAuth 2.0 on the broker; empty otherwise."
              readOnly: true
            oauthClientId:
              type: string
              description: "(Read Only) Client the workload authenticates as at the token endpoint."
              readOnly: true
            oauthAssertionFile:
              type: string
              description: "(Read Only) Path to the projected ServiceAccount token the workload presents as its client assertion."
              readOnly: true
            oauthCaFile:
              type: string
              description: "(Read Only) Path to the certificate authority that signs the token endpoint's certificate."
              readOnly: true
            secrets:
              type: object
              description: "(Read Only) Recipe secrets. The reserved `name` sub-property references the managed Radius.Security/secrets resource that Radius materializes from the Recipe's `result.secrets`. Bind a key into a container environment variable with `secretKeyRef`, using `<resource>.properties.secrets.name` as `secretName`."
              properties:
                name:
                  type: string
                  description: "(Reserved) Name of the managed Radius.Security/secrets resource. Use as `secretName` in a container `secretKeyRef`."
                  readOnly: true
                username:
                  type: string
                  description: "Username used to authenticate to the broker. Set by RabbitMQ Recipes; delivered via the managed secret."
                  readOnly: true
                password:
                  type: string
                  description: "Password used to authenticate to the broker. Set by RabbitMQ Recipes; delivered via the managed secret."
                  readOnly: true
          required: [environment]
